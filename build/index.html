<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Youth work management system for remote First Nations communities">
    <meta name="theme-color" content="#0a1828">
    <title>Mission Control v2.0 - Youth Work Management</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables */
        :root {
            --navy-deep: #0a1828;
            --navy-mid: #1e3a5f;
            --navy-light: #2c5f8d;
            --amber-warm: #ffa726;
            --amber-bright: #ffb74d;
            --cream: #fef6e4;
            --gray-soft: #8892b0;
            --success: #4ade80;
            --alert: #fb923c;
            --purple: #a78bfa;
            --cyan: #67e8f9;

            /* Semantic colors */
            --color-academics: #60a5fa;
            --color-fitness: #f97316;
            --color-music: #10b981;
            --color-cooking: #a78bfa;
            --color-games: #fbbf24;
            --color-program: #8b5cf6;
            --color-cancelled: #ef4444;

            /* Typography */
            --font-display: 'Space Mono', monospace;
            --font-body: 'Outfit', sans-serif;

            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
            min-height: 100vh;
            color: var(--cream);
            padding: 1.5rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Screen reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Header */
        .header {
            margin-bottom: 2rem;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, var(--amber-warm), var(--amber-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--gray-soft);
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .version-badge {
            display: inline-block;
            background: var(--purple);
            color: var(--navy-deep);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 1rem;
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.8s ease-out 0.1s both;
            overflow-x: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-tab {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--gray-soft);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            font-family: var(--font-body);
            white-space: nowrap;
        }

        .nav-tab:hover {
            color: var(--cream);
        }

        .nav-tab:focus {
            outline: 2px solid var(--amber-warm);
            outline-offset: 2px;
        }

        .nav-tab.active {
            color: var(--amber-warm);
            border-bottom-color: var(--amber-warm);
        }

        /* Sections */
        .section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .section.active {
            display: block;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-subtitle {
            color: var(--gray-soft);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        /* Form Inputs */
        .input-field {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--cream);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--amber-warm);
            background: rgba(255, 255, 255, 0.12);
        }

        .input-field::placeholder {
            color: var(--gray-soft);
        }

        select.input-field {
            background: var(--navy-light);
            color: var(--cream);
            cursor: pointer;
        }

        select.input-field option {
            background: var(--navy-light);
            color: var(--cream);
            padding: 0.5rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-soft);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .logo {
                font-size: 1.8rem;
            }

            .nav-tab {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .card {
                padding: 1.5rem;
            }
        }

zes players by tagging them. Frozen players stand still until another player tags them to unfreeze.",minAge:4,maxAge:12,energy:"high",competition:"low",location:"indoor/outdoor"},{name:"Tunnel Tag",description:"Tagged players form a tunnel by spreading legs. Others crawl through to unfreeze them.",minAge:5,maxAge:12,energy:"high",competition:"low",location:"indoor/outdoor"},{name:"Blob Tag",description:"Tagged players join hands with the tagger to form a growing 'blob' that tags more players together.",minAge:6,maxAge:14,energy:"high",competition:"team",location:"indoor/outdoor"},{name:"Band-Aid Tag",description:"When tagged, hold the spot like a band-aid. After two tags, become a tagger or sit out.",minAge:6,maxAge:12,energy:"high",competition:"medium",location:"indoor/outdoor"},{name:"Elbow Tag",description:"Players pair up and link elbows. One chaser and runner; runner links to a pair to make the other end chase.",minAge:7,maxAge:14,energy:"high",competition:"low",location:"indoor/outdoor"},{name:"Turtle Tag",description:"Tagged players lie on their back like a turtle, waving arms and legs. Unfrozen when another player flips them over (tags).",minAge:5,maxAge:10,energy:"medium",competition:"low",location:"indoor/outdoor"},{name:"Toilet Tag",description:"Tagged players squat like a toilet with one arm up as handle. Unfrozen when someone 'flushes' by pushing the arm down.",minAge:6,maxAge:12,energy:"high",competition:"low",location:"indoor/outdoor"},{name:"Skunk Tag",description:"One tagger; tagged players hold nose like smelling a skunk and can only move with one hand free until tagging someone else.",minAge:6,maxAge:12,energy:"high",competition:"medium",location:"indoor/outdoor"},{name:"Dead Ant Tag",description:"Tagged lie on back with legs up. Four untagged players must lift each limb to unfreeze.",minAge:7,maxAge:14,energy:"high",competition:"low",location:"indoor/outdoor"},{name:"Hot Dog Tag",description:"Tagged lie down like a hot dog bun. Unfrozen when two  finish line.",minAge:7,maxAge:14,energy:"high",competition:"team",location:"indoor/outdoor"},{name:"Invisible Obstacle Course",description:"Leader describes imaginary obstacles; players act out navigating them without touching 'real' ground.",minAge:5,maxAge:12,energy:"medium",competition:"none",location:"indoor/outdoor"},{name:"Hand Game",description:"Players hide a small object (like a pebble) in one hand. Others guess which hand; correct guess wins a point.",minAge:5,maxAge:12,energy:"low",competition:"low",location:"indoor/outdoor"},{name:"Rock in the Fist",description:"Similar to Hand Game: guess which fist holds the rock. Can be played in teams.",minAge:5,maxAge:10,energy:"low",competition:"low",location:"indoor/outdoor"},{name:"Green Glass Door",description:"Riddle game: guess the rule (words with double letters pass through the door).",minAge:8,maxAge:14,energy:"low",competition:"none",location:"indoor"},{name:"Black Magic",description:"Mind game where leader guesses objects based on secret signal from partner.",minAge:8,maxAge:14,energy:"low",competition:"none",location:"indoor"},{name:"Hopscotch",description:"Draw grid with stick, hop through tossing a stone, picking it up on return.",minAge:5,maxAge:10,energy:"medium",competition:"low",location:"outdoor"},{name:"Toe Toss",description:"Players sit and toss a stick or small object using their toes, trying to catch or throw farthest.",minAge:6,maxAge:12,energy:"low",competition:"low",location:"indoor/outdoor"},{name:"Make the Stick Jump",description:"Hold a stick horizontally between two players, jump over it, raising height each round.",minAge:6,maxAge:12,energy:"medium",competition:"low",location:"indoor/outdoor"},{name:"Ring Games",description:"Players form a circle and pass a ring (or imaginary) while guessing who has it.",minAge:5,maxAge:12,energy:"low",competition:"none",location:"indoor/outdoor"},{name:"Jump!",description:"Leader calls directions like 'jump left' or 'jump high'; players follow quickl
